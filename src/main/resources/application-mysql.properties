# Production profile. Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables (never commit real passwords).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lablink}
spring.datasource.username=${DB_USERNAME:lablink}
spring.datasource.password=${DB_PASSWORD:}

# The DDL uses CREATE TABLE IF NOT EXISTS, so running it on every start is safe.
spring.sql.init.mode=always
spring.thymeleaf.cache=true
