# Production profile. Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables (never commit real passwords).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lablink}
spring.datasource.username=${DB_USERNAME:lablink}
spring.datasource.password=${DB_PASSWORD:}

# Schema only - no demo data in production. To load the demo data into MySQL too, run with
# both profiles:  -Dspring-boot.run.profiles=mysql,seed
spring.flyway.locations=classpath:db/migration

# A MySQL database created by the Milestone 2 schema.sql already has the V1 tables. Baselining
# at version 1 tells Flyway "V1 is already applied here" so it starts from V2 instead of failing.
# (On an empty database this setting does nothing.)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.thymeleaf.cache=true
