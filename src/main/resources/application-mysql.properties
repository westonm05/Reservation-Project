# ---------------------------------------------------------------
# MySQL profile - used for the deployed app.
# Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Credentials come from environment variables, never from Git.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lablink}
spring.datasource.username=${DB_USER:lablink}
spring.datasource.password=${DB_PASSWORD}

# Create tables only on first setup (set DB_INIT=always once, then never).
spring.sql.init.mode=${DB_INIT:never}
