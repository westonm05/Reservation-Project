spring.application.name=lablink

# ---- Development database: H2, in memory, recreated every time the app starts ----
spring.datasource.url=jdbc:h2:mem:lablink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---- Schema: Flyway migrations (see docs/database-design.md and ADR-0005) ----
# db/migration holds the schema (V1__, V2__ ... run once each, in order).
# db/seed holds R__seed_test_data.sql, the demo/test data. It is included here for development
# and tests only; the mysql profile leaves it out unless the "seed" profile is also active.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Hibernate never creates or changes tables. "validate" makes startup fail if an entity class
# doesn't match the tables Flyway built, so the ORM model and the DDL can't drift apart.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# ---- Operations (see docs/monitoring.md) ----
# Actuator endpoints: health is public (Docker health check), metrics/info need a lab manager.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=LAB_MANAGER
info.app.name=LabLink
info.app.version=@project.version@

# Lets the app shut down cleanly (finish in-flight requests) when Docker stops the container.
server.shutdown=graceful

# First lab-manager account for an empty production database (see docs/deployment.md).
# Blank = do nothing. Only used when no lab manager exists yet.
lablink.bootstrap-admin.email=${LABLINK_ADMIN_EMAIL:}
lablink.bootstrap-admin.password=${LABLINK_ADMIN_PASSWORD:}
lablink.bootstrap-admin.name=${LABLINK_ADMIN_NAME:LabLink Administrator}
