# ---------------------------------------------------------------
# Default (development) settings: in-memory H2 database.
# Nothing to install - data resets every time the app restarts.
# ---------------------------------------------------------------
spring.application.name=lablink

spring.datasource.url=jdbc:h2:mem:lablink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# schema.sql + data.sql create the tables; Hibernate only checks that
# our entity classes match them (see ADR-0003).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

# Print each SQL statement to the console while developing (set to false to quiet it)
spring.jpa.show-sql=false

# Show friendly error pages instead of stack traces
server.error.include-stacktrace=never
