spring.application.name=lablink

# ---- Development database: H2, in memory, recreated every time the app starts ----
spring.datasource.url=jdbc:h2:mem:lablink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tables come from our own DDL script (src/main/resources/db/schema.sql), not from Hibernate,
# so the script in the design document is exactly what the app runs.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
