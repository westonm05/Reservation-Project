spring.application.name=lablink

# ---- Development database: H2, in memory, recreated every time the app starts ----
spring.datasource.url=jdbc:h2:mem:lablink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---- Schema: Flyway migrations (see docs/database-design.md and ADR-0005) ----
# db/migration holds the schema (V1__, V2__ ... run once each, in order).
# db/seed holds R__seed_test_data.sql, the demo/test data. It is included here for development
# and tests only; the mysql profile leaves it out unless the "seed" profile is also active.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Hibernate never creates or changes tables. "validate" makes startup fail if an entity class
# doesn't match the tables Flyway built, so the ORM model and the DDL can't drift apart.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
