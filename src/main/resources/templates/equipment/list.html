<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Equipment')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <h1>Equipment</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <p sec:authorize="hasRole('LAB_MANAGER')"><a class="button" th:href="@{/equipment/new}">Add equipment</a></p>

    <!-- Search and filter (backlog 3.8) -->
    <form th:action="@{/equipment}" method="get" class="filters" role="search">
        <label>Search
            <input type="search" name="q" th:value="${q}" placeholder="Name, serial number or description">
        </label>
        <label>Category
            <select name="categoryId">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == categoryId}">Category</option>
            </select>
        </label>
        <label>Status
            <select name="status">
                <option value="">Any status</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == status}">STATUS</option>
            </select>
        </label>
        <button type="submit">Search</button>
        <a th:href="@{/equipment}">Clear</a>
    </form>

    <table>
        <thead><tr><th>Name</th><th>Category</th><th>Serial</th><th>Location</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${equipmentList}">
            <td th:text="${e.name}"></td>
            <td th:text="${e.category != null} ? ${e.category.name} : '-'"></td>
            <td th:text="${e.serialNumber}"></td>
            <td th:text="${e.lab != null} ? ${e.lab.name} : 'Portable'"></td>
            <td><span th:class="'badge ' + ${e.status}" th:text="${e.status}"></span></td>
            <td class="actions">
                <a th:if="${e.status.name() == 'AVAILABLE'}" th:href="@{/reservations/new(equipmentId=${e.id})}">Reserve</a>
                <th:block sec:authorize="hasRole('LAB_MANAGER')">
                    <a th:href="@{/equipment/{id}/edit(id=${e.id})}">Edit</a>
                    <form th:action="@{/equipment/{id}/delete(id=${e.id})}" method="post" class="inline"
                          onsubmit="return confirm('Delete this equipment?')">
                        <button type="submit" class="link danger">Delete</button>
                    </form>
                </th:block>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(equipmentList)}">
            <td colspan="6" class="hint">No equipment matches your search.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
