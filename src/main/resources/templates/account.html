<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My account')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
    <h1>My account</h1>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="card">
        <p><strong>Name:</strong> <span th:text="${user.fullName}">Name</span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}">email</span></p>
        <p><strong>Role:</strong> <span th:text="${user.role}">ROLE</span></p>
        <p><strong>Member since:</strong> <span th:text="${#temporals.format(user.createdAt, 'MMMM d, yyyy')}">date</span></p>
    </div>

    <h2>Change password</h2>
    <form th:action="@{/account/password}" th:object="${form}" method="post" class="card">
        <label>Current password
            <input type="password" th:field="*{currentPassword}" autocomplete="current-password">
            <span class="field-err" th:errors="*{currentPassword}"></span>
        </label>
        <label>New password
            <input type="password" th:field="*{newPassword}" autocomplete="new-password">
            <span class="field-err" th:errors="*{newPassword}"></span>
        </label>
        <label>Confirm new password
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
            <span class="field-err" th:errors="*{confirmPassword}"></span>
        </label>
        <button type="submit">Change password</button>
    </form>
</main>
</body>
</html>
