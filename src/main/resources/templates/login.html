<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
    <h1>Log in</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <p class="flash err" th:if="${param.error}">Wrong email or password.</p>
    <p class="flash ok" th:if="${param.logout}">You have been logged out.</p>

    <form th:action="@{/login}" method="post" class="card">
        <label>Email <input type="email" name="email" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p>New here? <a th:href="@{/register}">Create an account</a></p>
    <p class="hint">Demo accounts: manager@lablink.edu / manager123 · faculty@lablink.edu / faculty123 · student@lablink.edu / student123</p>
</main>
</body>
</html>
